<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16181D">
<title>Seguí tu pedido · Logística Total</title>
<link rel="icon" href="../icono.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
:root{--noche:#16181D;--naranja:#F07F1D;--verde:#1E9E58;--rojo:#D64541;--morado:#7B3FC4;--tinta:#1C1F25;--tenue:#69707C;--linea:#E3E6EB;--fondo:#F3F4F6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tinta);-webkit-font-smoothing:antialiased}
header{background:var(--noche);color:#fff;padding:16px 18px 18px;border-bottom:3px solid var(--naranja);display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px}
header small{display:block;color:var(--naranja);font-weight:800;letter-spacing:.12em;font-size:11px}
header h1{margin:2px 0 0;font-size:20px;font-weight:800}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:12px}
.estado h2{margin:0 0 6px;font-size:24px;line-height:1.2}
.estado p{margin:4px 0 0;font-size:16px;color:var(--tenue);line-height:1.45}
.eta{font-size:44px;font-weight:800;color:var(--naranja);line-height:1;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.eta-sub{font-size:14px;color:var(--tenue)}
.chip{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:20px;background:#FDEBD9;color:#9A4A06;font-weight:700;font-size:15px}
.estado.ok h2{color:var(--verde)}.estado.mal h2{color:var(--rojo)}.estado.morado h2{color:var(--morado)}
.pasos{display:flex;justify-content:space-between;margin:2px 0 0;padding:0;list-style:none;position:relative}
.pasos:before{content:"";position:absolute;left:12%;right:12%;top:13px;height:3px;background:var(--linea)}
.pasos li{flex:1;text-align:center;font-size:12px;color:var(--tenue);position:relative}
.pasos li i{display:block;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;background:#fff;border:3px solid var(--linea)}
.pasos li.hecho i{background:var(--naranja);border-color:var(--naranja)}
.pasos li.hecho{color:var(--tinta);font-weight:700}
#mapa{height:300px;border-radius:14px;overflow:hidden}
.mapa-nota{font-size:13px;color:var(--tenue);margin:8px 2px 0}
.recordar{font-size:16px;line-height:1.5}
.recordar b{font-size:18px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:15px}
dt{color:var(--tenue)}dd{margin:0;font-weight:600}
footer{text-align:center;font-size:13px;color:var(--tenue);margin-top:18px;line-height:1.5}
.mk{display:block;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:19px}
.mk-casa{background:var(--noche)}.mk-cam{background:var(--naranja)}
@media (prefers-reduced-motion:no-preference){.vivo:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);margin-right:6px;animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}}
</style>
</head>
<body>
<header><img src="../logo-lt.png" alt=""><div><small>LOGÍSTICA TOTAL SRL</small><h1>Seguí tu pedido</h1></div></header>
<main id="m"><div class="card estado"><h2>Cargando…</h2></div></main>
<script src="../firebase-config.js"></script>
<script src="../vendor/leaflet/leaflet.js"></script>
<script>
/* Seguimiento público de un pedido: lee seguimiento/{token} (lectura pública solo con el token, que
   va en el link del WhatsApp) cada 20 segundos. La ubicación del camión solo se muestra mientras
   viene hacia este cliente. */
(function () {
  'use strict';
  var $m = document.getElementById('m');
  var t = (new URLSearchParams(location.search).get('t') || '').trim();
  var base = window.LT_FIREBASE && String(window.LT_FIREBASE.databaseURL || '').replace(/\/+$/, '');
  var mapa = null, capa = null, encuadre = '', datos = null, leidoEn = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hhmm(ms) { var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function hoy() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function plata(n) { return '$ ' + Math.round(n || 0).toLocaleString('es-AR'); }
  function mensaje(h, p, clase) { $m.innerHTML = '<div class="card estado ' + (clase || '') + '"><h2>' + h + '</h2>' + (p ? '<p>' + p + '</p>' : '') + '</div>'; }
  if (!/^[A-Za-z0-9]{16,40}$/.test(t) || !base) { mensaje('Enlace no válido', 'Revisá que hayas abierto el enlace completo que te llegó por WhatsApp.'); return; }

  function leer() {
    fetch(base + '/seguimiento/' + t + '.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
      .then(function (d) { datos = d; leidoEn = Date.now(); pintar(); })
      .catch(function () { if (!datos) mensaje('Sin conexión', 'No pudimos consultar el estado de tu pedido. Probá de nuevo en un rato.'); });
  }
  function pintar() {
    var d = datos;
    if (!d) { mensaje('Enlace no válido o vencido', 'No encontramos este seguimiento. Si tenés dudas, respondé el WhatsApp que te enviamos.'); return; }
    var otroDia = d.dia && d.dia !== hoy();
    var e = d.estado || 'en_camino', fin = { entregado: 1, parcial: 1, no_entregado: 1, no_concretada: 1 }[e];
    var h = '', paso = e === 'en_el_lugar' ? 3 : fin ? 4 : d.antes === 0 ? 2 : 1;
    if (otroDia && !fin) h += '<div class="card estado"><h2>Seguimiento del ' + esc(d.dia.split('-').reverse().slice(0, 2).join('/')) + '</h2><p>Este enlace corresponde a una entrega de otro día.</p></div>';
    else {
      var est = '';
      if (e === 'entregado') est = '<div class="card estado ok"><h2>¡Pedido entregado!</h2><p>Entregado a las ' + hhmm(d.tFin || d.actualizado) + '. Gracias por elegirnos.</p></div>';
      else if (e === 'parcial') est = '<div class="card estado ok"><h2>Pedido entregado</h2><p>Se entregó en forma parcial a las ' + hhmm(d.tFin || d.actualizado) + '. Ante cualquier duda, respondé el WhatsApp.</p></div>';
      else if (e === 'no_entregado') est = '<div class="card estado mal"><h2>No pudimos entregar tu pedido</h2><p>' + (d.motivo ? 'Motivo: ' + esc(d.motivo) + '. ' : '') + 'Si querés coordinar, respondé el WhatsApp que te enviamos.</p></div>';
      else if (e === 'no_concretada') est = '<div class="card estado morado"><h2>No pudimos concretar la visita</h2><p>' + (d.motivo ? esc(d.motivo) + '. ' : '') + 'Nuestro equipo se va a comunicar para volver a coordinar la entrega.</p></div>';
      else if (e === 'en_el_lugar') est = '<div class="card estado ok"><h2>El repartidor llegó a tu domicilio</h2><p>Llegó a las ' + hhmm(d.tLlego || d.actualizado) + '.</p></div>';
      else est = '<div class="card estado"><h2>Tu pedido está en camino</h2>' + (d.eta ? '<div class="eta">' + hhmm(d.eta) + '</div><div class="eta-sub">hora estimada de llegada</div>' : '') +
        (d.antes === 0 ? '<span class="chip">¡Sos la próxima entrega!</span>' : d.antes > 0 ? '<span class="chip">' + d.antes + (d.antes === 1 ? ' entrega antes que la tuya' : ' entregas antes que la tuya') + '</span>' : '') + '</div>';
      h += est;
      h += '<div class="card"><ol class="pasos">' + ['En camino', 'Próxima entrega', 'En tu domicilio', 'Entregado'].map(function (x, i) { return '<li class="' + (i < paso ? 'hecho' : '') + '"><i></i>' + x + '</li>'; }).join('') + '</ol></div>';
    }
    var verCamion = !fin && !otroDia && e === 'en_camino' && d.camion && Date.now() - d.camion.t < 15 * 6e4;
    if (!fin && !otroDia && (d.ll || verCamion)) h += '<div class="card"><div id="mapa" role="img" aria-label="Mapa con tu domicilio' + (verCamion ? ' y la ubicación del camión' : '') + '"></div><p class="mapa-nota">' +
      (verCamion ? 'La ubicación del camión se actualiza cada minuto y se muestra solo mientras viene hacia tu domicilio.' : 'La ubicación del camión se muestra cuando está en camino hacia vos.') + '</p></div>';
    if (!fin && !otroDia && (d.monto || d.cajones)) h += '<div class="card recordar">Recordá tener listo <b>' + plata(d.monto) + '</b>' + (d.cajones ? ' y <b>' + d.cajones + (d.cajones === 1 ? ' cajón' : ' cajones') + '</b> con sus botellas retornables' : '') + '.</div>';
    h += '<div class="card"><dl><dt>Cliente</dt><dd>' + esc(d.cliente || '') + '</dd>' + (d.domicilio ? '<dt>Domicilio</dt><dd>' + esc(d.domicilio) + '</dd>' : '') + (d.ventana ? '<dt>Horario</dt><dd>' + esc(d.ventana) + '</dd>' : '') + '</dl></div>';
    h += '<footer>' + (fin || otroDia ? '' : '<span class="vivo">En vivo</span> · ') + 'Actualizado a las ' + hhmm(d.actualizado || leidoEn) + '<br>Logística Total S.R.L.</footer>';
    var mapaPrevio = mapa && document.getElementById('mapa');
    if (mapaPrevio) { mapa.remove(); mapa = null; }
    $m.innerHTML = h;
    var el = document.getElementById('mapa');
    if (el && window.L) {
      mapa = L.map(el, { zoomControl: false, attributionControl: true, dragging: true, scrollWheelZoom: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapa);
      var pts = [];
      var ico = function (c, t2) { return L.divIcon({ className: '', html: '<i class="mk ' + c + '">' + t2 + '</i>', iconSize: [38, 38], iconAnchor: [19, 19] }); };
      if (d.ll) { L.marker(d.ll, { icon: ico('mk-casa', '🏠'), title: 'Tu domicilio' }).addTo(mapa); pts.push(d.ll); }
      if (verCamion) { var c = [d.camion.lat, d.camion.lng]; L.marker(c, { icon: ico('mk-cam', '🚚'), title: 'Camión' }).addTo(mapa); pts.push(c); }
      if (pts.length > 1) mapa.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); else if (pts.length) mapa.setView(pts[0], 15);
    }
  }
  leer();
  setInterval(function () { if (!document.hidden) leer(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - leidoEn > 10000) leer(); });
})();
</script>
</body>
</html>
